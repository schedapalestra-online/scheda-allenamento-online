body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,'Segoe UI',Roboto,sans-serif;padding-bottom:110px}
header{position:sticky;top:0;z-index:10;background:var(--ink);color:#fff;padding:12px 14px 10px}
header h1{margin:0 0 2px;font-size:15px;letter-spacing:.18em;text-transform:uppercase;font-weight:900}

.tabs{display:flex;gap:8px}
.tab{flex:1;border:2px solid #4a4d52;background:transparent;color:#c8cacd;border-radius:999px;padding:8px 0;font-weight:800;font-size:13px;letter-spacing:.06em}

.daytitle{padding:14px 16px 2px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#6a6d70;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:10px 12px;overflow:hidden}
.card.done{opacity:.55}
.imgwrap{background:#f6f5f1;border-bottom:1px solid var(--line);text-align:center}
.imgwrap img{max-width:100%;max-height:260px;display:block;margin:0 auto}
.body{padding:12px 14px}
h2{margin:0;font-size:17px;font-weight:900}
.meta{display:flex;gap:6px;margin:8px 0 10px;flex-wrap:wrap}
.pill{background:#f0efe9;border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:12.5px;font-weight:700}
.pill.rest{background:#fbeee0;border-color:#e8d3b8}
.cues{margin:0;padding-left:18px;font-size:14px;line-height:1.5;color:#3a3d41}
.cues li{margin:2px 0}
.exec{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;font-size:14px;line-height:1.55}
.exectitle{font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--red);margin-bottom:2px}

.exec li{margin:4px 0}
.exec .err{background:#fdeaea;border-left:3px solid var(--red);padding:6px 10px;border-radius:0 6px 6px 0;margin-top:8px}

.exec .yt a{color:var(--red);font-weight:700}
.msg{margin:10px 14px;padding:8px 12px;background:#fff7e0;border-left:3px solid #d9a400;font-size:13px;border-radius:0 8px 8px 0}
.kgrow{display:flex;gap:8px;align-items:center;margin-top:10px}
.kgrow label{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#8a8d90;font-weight:700}
.kgrow input{width:90px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:15px;font-weight:800;text-align:center}
.vidfb{font-size:12.5px;margin-top:6px}
.vidfb a{color:var(--red);font-weight:700}
.report{display:block;margin:14px 12px 4px;width:calc(100% - 24px);border:0;border-radius:12px;padding:14px 0;
 font-weight:900;font-size:15px;background:#1f7a3d;color:#fff}
.sets{display:flex;gap:10px;margin:12px 0 2px;align-items:center}
.setlbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#8a8d90;font-weight:700}

.plate.on{background:var(--ink);color:var(--chalk);box-shadow:inset 0 0 0 4px var(--chalk)}
.vidbox{margin-top:12px;border-radius:12px;overflow:hidden;background:#000;position:relative;aspect-ratio:16/9;display:none}
.vidbox.show{display:block}
.vidbox iframe,.vidbox video{width:100%;height:100%;border:0;display:block}
.row{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;border:0;border-radius:10px;padding:11px 0;font-weight:800;font-size:14px}
.btn.timer{background:var(--red);color:#fff}
.btn.video{background:#f0efe9;border:1px solid var(--line);color:var(--ink);text-align:center;text-decoration:none;line-height:1;padding:13px 0}
#bar{position:fixed;left:0;right:0;bottom:-120px;transition:bottom .25s;background:var(--ink);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 16px;z-index:20}
#bar.show{bottom:0}

#tname{flex:1;font-size:13px;color:#c8cacd;line-height:1.3}
#bar button{border:0;border-radius:10px;padding:10px 12px;font-weight:800}
#plus{background:#4a4d52;color:#fff}
#stop{background:var(--red);color:#fff}
#ring{width:52px;height:52px;transform:rotate(-90deg)}
#ring circle{fill:none;stroke-width:6}
#ring .bgc{stroke:#4a4d52}
#ring .fgc{stroke:var(--chalk);stroke-linecap:round;transition:stroke-dashoffset 1s linear}

async function loadScheda(){
  try{
    const snap=await getDoc(doc(db,'utenti',USER.uid,'dati','scheda'));
    if(snap.exists()){ SCHEDA=snap.data(); DATA=SCHEDA.giorni; }
    document.getElementById('notice').innerHTML='';
  }catch(e){
    document.getElementById('notice').innerHTML='<div class="msg">Offline: mostro l\'ultima scheda salvata.</div>';
  }
  try{ const ns=await getDoc(doc(db,'utenti',USER.uid,'dati','nota'));
    if(ns.exists() && ns.data().testo){
      document.getElementById('coachnote').innerHTML=
        `<div class="coach"><div class="cd">Nota dello zio · ${ns.data().data||''}</div>${ns.data().testo}</div>`;
    } else { document.getElementById('coachnote').innerHTML=''; }
  }catch(e){}
  try{ const ws=await getDoc(doc(db,'utenti',USER.uid,'dati','pesi'));
    if(ws.exists()) LASTW=ws.data();
  }catch(e){}
  // banner "oggi tocca"
  const wd=['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'][new Date().getDay()];
  const oggi=DATA.findIndex(d=>d.d.toLowerCase().startsWith(wd.slice(0,5)));
  if(oggi>=0){
    document.getElementById('todaybox').innerHTML=
      `<div class="today">💪 Oggi tocca: <span style="color:var(--chalk)">${DATA[oggi].d} — ${DATA[oggi].t||''}</span></div>
       <button class="icsbtn" onclick="scaricaICS()">🔔 Aggiungi promemoria al calendario del telefono</button>`;
    day=oggi;
  } else {
    document.getElementById('todaybox').innerHTML='<button class="icsbtn" onclick="scaricaICS()">🔔 Aggiungi promemoria al calendario del telefono</button>';
  }
  buildTabs(); render();
}
window.scaricaICS=function(){
  const map={'lun':'MO','mar':'TU','mer':'WE','gio':'TH','ven':'FR','sab':'SA','dom':'SU'};
  let ics='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//scheda//IT\r\n';
  DATA.forEach((d,i)=>{
    const by=map[d.d.slice(0,3).toLowerCase()]; if(!by) return;
    ics+='BEGIN:VEVENT\r\nUID:scheda-'+i+'@app\r\nDTSTART;TZID=Europe/Rome:20260713T170000\r\nDURATION:PT1H30M\r\n'
      +'RRULE:FREQ=WEEKLY;BYDAY='+by+'\r\nSUMMARY:Allenamento: '+(d.t||d.d)+'\r\n'
      +'BEGIN:VALARM\r\nTRIGGER:-PT30M\r\nACTION:DISPLAY\r\nDESCRIPTION:Allenamento tra 30 minuti\r\nEND:VALARM\r\nEND:VEVENT\r\n';
  });
  ics+='END:VCALENDAR\r\n';
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));
  a.download='promemoria_allenamenti.ics'; a.click();
}
function buildTabs(){
  document.getElementById('htitle').textContent=SCHEDA.titolo||'La mia scheda';
  document.getElementById('hupd').textContent=SCHEDA.aggiornata?('Aggiornata il '+SCHEDA.aggiornata):'';
  const tabs=document.getElementById('tabs'); tabs.innerHTML='';
  DATA.forEach((d,i)=>{const b=document.createElement('button');
    b.className='tab'+(i===day&&day>=0?' on':''); b.textContent=d.d.slice(0,3).toUpperCase();
    b.onclick=()=>{day=i;render();}; tabs.appendChild(b);});
  const nb=document.createElement('button');
  nb.className='tab'+(day===-1?' on':''); nb.textContent='🍽';
  nb.style.flex='0 0 46px'; nb.onclick=()=>{day=-1;renderNutri();}; tabs.appendChild(nb);
  const mb=document.createElement('button');
  mb.className='tab'+(day===-2?' on':''); mb.textContent='📏';
  mb.style.flex='0 0 46px'; mb.onclick=()=>{day=-2;renderMisure();}; tabs.appendChild(mb);
}
function img(e){
  if(e.img && IMGS[e.img]) return `<div class="imgwrap"><img loading="lazy" src="data:image/jpeg;base64,${IMGS[e.img]}" alt=""></div>`;
  if(e.imgurl) return `<div class="imgwrap"><img loading="lazy" src="${e.imgurl}" alt=""></div>`;
  return '';
}
const NUTRI_HTML=`
<div class="nutri">
 <div class="nb warn2"><strong>Prima di tutto:</strong> questi sono principi generali di educazione alimentare, non una dieta. Per quantità personalizzate (soprattutto per dimagrire) serve un medico o un nutrizionista. A 17 anni sei ancora in crescita: mai diete fai-da-te o troppo restrittive.</div>

 <h3>La regola numero uno</h3>
 <p>Da principiante che vuole <strong>mettere muscolo e definirsi insieme</strong>, non devi né abbuffarti né metterti a dieta. All'inizio il corpo fa entrambe le cose se mangi <em>bene e a sufficienza</em>. Obiettivo: pasti normali e regolari, non "tanto" e non "poco".</p>

 <h3>Il metodo del piatto</h3>
 <p>Il modo più semplice per comporre un pasto senza pesare niente. Dividi il piatto in tre:</p>
 <div class="plate-vis"><div class="pv verd">½ VERDURA</div><div class="pv carb">¼ CARBOIDRATI</div><div class="pv prot">¼ PROTEINE</div></div>
 <ul>
   <li><strong>Metà verdura</strong> (cruda o cotta): riempie, dà fibra e micronutrienti.</li>
   <li><strong>Un quarto carboidrati</strong>: pasta, riso, pane, patate. Sono il carburante per allenarti, non il nemico.</li>
   <li><strong>Un quarto proteine</strong>: carne, pesce, uova, legumi, latticini. Servono a costruire il muscolo.</li>
   <li>Aggiungi un cucchiaio di <strong>olio d'oliva</strong> a crudo e un frutto.</li>
 </ul>

 <h3>Perché 300 g di pasta + 300 g di spezzatino no</h3>
 <p>È il classico errore. Ecco le porzioni <em>indicative</em> per un ragazzo attivo della tua età (a crudo):</p>
 <table class="ptab">
   <tr><th>Alimento</th><th>Porzione indicativa</th><th>L'errore</th></tr>
   <tr><td>Pasta / riso</td><td>80–100 g</td><td>300 g = tripla porzione</td></tr>
   <tr><td>Carne / pesce</td><td>100–150 g</td><td>300 g = doppia porzione</td></tr>
   <tr><td>Pane</td><td>50–70 g</td><td>—</td></tr>
   <tr><td>Verdura</td><td>a volontà</td><td>quella che spesso manca</td></tr>
   <tr><td>Frutta</td><td>1–2 frutti</td><td>—</td></tr>
 </table>
 <p class="note2">Un piatto da 300+300 è due-tre pasti in uno, quasi senza verdura: troppo in un colpo solo, poco equilibrato. Meglio la porzione giusta e, se hai ancora fame, aggiungere verdura o un frutto.</p>

 <h3>Come distribuire la giornata</h3>
 <ul>
   <li><strong>Non saltare la colazione</strong>: è il pasto che salti proprio quando ti alleni. Vanno bene latte/yogurt, cereali o pane, un frutto.</li>
   <li><strong>3 pasti + 1–2 spuntini</strong> (frutta, yogurt, frutta secca) tengono stabile l'energia meglio di due mega-pasti.</li>
   <li><strong>Attorno all'allenamento</strong>: un pasto normale 1–2 ore prima; dopo, un pasto completo con proteine e carboidrati. Niente di complicato.</li>
 </ul>

 <h3>Acqua</h3>
 <p>Bevi durante il giorno e in allenamento. Circa <strong>1,5–2 litri</strong>, di più se sudi molto. Le bibite zuccherate e gli energy drink non contano e sono da limitare.</p>

 <h3>I 5 errori del principiante</h3>
 <ul>
   <li><strong>Saltare i pasti</strong> pensando di definirsi: rallenti i progressi e arrivi affamato la sera.</li>
   <li><strong>Proteine "a tutti i costi"</strong>: servono, ma 300 g di carne non fanno più muscolo di 130. Il muscolo cresce con allenamento + sonno + cibo adeguato, non con l'eccesso.</li>
   <li><strong>Integratori e proteine in polvere</strong>: da principiante non servono. Prima si sistema il piatto vero. Semmai, ne parli con un professionista.</li>
   <li><strong>Diete drastiche viste sui social</strong>: a 17 anni fanno più danni che risultati.</li>
   <li><strong>Dormire poco</strong>: il muscolo si costruisce nel recupero. 8+ ore contano quanto la palestra.</li>
 </ul>

 <div class="nb warn2"><strong>Quando serve il professionista:</strong> se l'obiettivo è perdere peso in modo mirato, se ci sono allergie o condizioni mediche, o se vuoi numeri precisi (calorie, grammature). Un nutrizionista imposta tutto sulla persona; questa scheda serve solo a farti capire come è fatto un pasto sensato.</p></div>
</div>

    utente:USER?USER.email:'', creato:serverTimestamp()
  };
  if(!rec.peso && !rec.vita){alert('Inserisci almeno peso o vita.');return;}
  try{ await addDoc(collection(db,'utenti',USER.uid,'misure'),rec); caricaMisure(); 
    document.getElementById('m_peso').value='';document.getElementById('m_vita').value='';document.getElementById('m_note').value=''; }
  catch(e){ alert('Salvataggio in coda (offline): verrà inviato appena c\'è connessione.'); }
}
async function caricaMisure(){
  const box=document.getElementById('mistoria'); if(!box)return;
  try{
    const q=query(collection(db,'utenti',USER.uid,'misure'),orderBy('creato','desc'),limit(40));
    const snap=await getDocs(q);
    if(snap.empty){box.innerHTML='<p style="color:var(--dim);font-size:14px;margin-top:14px">Nessuna misura registrata. Salva la prima qui sopra.</p>';return;}
    const rows=[]; snap.forEach(d=>rows.push(d.data()));
    let h='<table class="mistab"><tr><th>Data</th><th>Peso</th><th>Vita</th><th>Var. peso</th></tr>';
    rows.forEach((r,i)=>{
      let tr='';
      const prev=rows[i+1];
      if(prev && r.peso && prev.peso){
        const d=(r.peso-prev.peso);
        const cls=d<0?'dn':(d>0?'up':'');
        tr=`<span class="trend ${cls}">${d>0?'+':''}${d.toFixed(1)}</span>`;
      }
      h+=`<tr><td>${r.data}${r.note?'<br><span style="color:var(--dim);font-size:11px">'+r.note+'</span>':''}</td>
        <td>${r.peso?r.peso+' kg':'—'}</td><td>${r.vita?r.vita+' cm':'—'}</td><td>${tr||'—'}</td></tr>`;
    });
    h+='</table>';
    box.innerHTML=h;
  }catch(e){ box.innerHTML='<p style="color:var(--dim)">Storico non disponibile offline.</p>'; }
}
window.render=function(){
  if(day===-1){renderNutri();return;}
  if(day===-2){renderMisure();return;}
  document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('on',i===day));
  const d=DATA[day];
  let h=`<div class="daytitle">${d.d} &mdash; ${d.t||''}</div>`;
  d.ex.forEach((e,j)=>{
    const key=day+'-'+j, n=done[key]||0, fin=n>=e.s;
    let plates='';
    for(let s=0;s<e.s;s++) plates+=`<button class="plate ${s<n?'on':''}" onclick="tick(${j},${s})">${s+1}</button>`;
    h+=`<div class="card ${fin?'done':''}">${img(e)}
      <div class="body"><h2>${e.n}</h2>
        <div class="meta"><span class="pill">${e.s} serie</span><span class="pill">${e.r} rip.</span><span class="pill rest">rec. ${e.rl}</span></div>
        ${e.rv?`<div class="reqvid">🎥 <strong>Lo zio ti chiede un video di questa esecuzione</strong>: filmati di lato, con carico leggero, una serie intera, e mandaglielo su WhatsApp.</div>`:''}
        ${e.c&&e.c.length?`<ul class="cues">${e.c.map(c=>`<li>${c}</li>`).join('')}</ul>`:''}
        ${e.st&&e.st.length?`<div class="exec"><div class="exectitle">Come si esegue</div>
          <ol>${e.st.map(s=>`<li>${s}</li>`).join('')}</ol>
          ${e.e?`<div class="err"><strong>Errori da evitare:</strong> ${e.e}</div>`:''}
          ${e.v?`<div class="yt"><strong>Tutorial YouTube:</strong> <a href="${e.v}" target="_blank">${e.v}</a></div>`:''}
        </div>`:''}
        <div class="sets"><span class="setlbl">Serie</span>${plates}</div>
        <div class="kgrow"><label>Peso usato</label><input type="number" inputmode="decimal" placeholder="kg" value="${kgs[key]||(LASTW[e.n]&&LASTW[e.n].kg)||''}" onchange="kgs['${key}']=this.value"></div>
        ${LASTW[e.n]?`<div class="lastw">Ultima volta (${LASTW[e.n].data}): ${LASTW[e.n].fatte}/${LASTW[e.n].tot} serie${LASTW[e.n].kg?' @ '+LASTW[e.n].kg+' kg':''}</div>`:''}
        <div class="vidbox" id="vid-${day}-${j}"></div>
        <div class="row">
          <button class="btn timer" onclick="startTimer(${e.rs},'${(e.n||'').replace(/'/g,"\\'")}')">&#9202; Recupero ${e.rl}</button>
          ${e.v?`<button class="btn video" onclick="playVideo(${j})">&#9654; Guarda il video</button>`:''}
        </div>
      </div></div>`;
  });
  h+=`<button class="savebtn" onclick="salva()">&#10003; Fine allenamento &mdash; salva</button><div id="okz"></div>`;
  document.getElementById('view').innerHTML=h;
}
window.salva=async function(){
  const d=DATA[day];
  const esercizi=d.ex.map((e,j)=>{const key=day+'-'+j;
    return {n:e.n, fatte:done[key]||0, tot:e.s, kg:kgs[key]||null};});
  const fatte=esercizi.reduce((a,x)=>a+x.fatte,0), tot=esercizi.reduce((a,x)=>a+x.tot,0);
  try{
    await addDoc(collection(db,'utenti',USER.uid,'allenamenti'),{
      data:new Date().toISOString().slice(0,10), giorno:d.d, gruppo:d.t||'',
      esercizi, fatte, tot, utente:USER?USER.email:'', creato:serverTimestamp()});
    const upd={};
    d.ex.forEach((e,j)=>{const key=day+'-'+j;
      if((done[key]||0)>0 || kgs[key]){
        upd[e.n]={kg:kgs[key]||(LASTW[e.n]&&LASTW[e.n].kg)||null,fatte:done[key]||0,tot:e.s,data:new Date().toISOString().slice(0,10)};
      }});
    if(Object.keys(upd).length){ try{ await setDoc(doc(db,'utenti',USER.uid,'dati','pesi'), upd, {merge:true}); Object.assign(LASTW,upd);}catch(e){} }
    document.getElementById('okz').innerHTML='<div class="okmsg">Allenamento salvato: lo zio lo vede nella sua dashboard. (Se sei offline verrà inviato appena torna la connessione.)</div>';
  }catch(e){
    document.getElementById('okz').innerHTML='<div class="msg">Salvataggio in coda: verrà inviato appena c\'è connessione.</div>';
  }
}
window.tick=function(j,s){
  const key=day+'-'+j, e=DATA[day].ex[j];
  done[key]=(done[key]||0)===s+1?s:s+1;
  render();
  if((done[key]||0)>0 && (done[key]||0)<e.s) startTimer(e.rs,e.n);
}
function ytId(u){const m=String(u).match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]{6,})/);return m?m[1]:null;}
window.playVideo=function(j){
  const e=DATA[day].ex[j], box=document.getElementById('vid-'+day+'-'+j);
  if(!box) return;
  if(box.classList.contains('show')){box.classList.remove('show');box.innerHTML='';if(box._fb){box._fb.remove();box._fb=null;}return;}
  if(/\.(mp4|webm|mov)(\?|$)/i.test(e.v)){box.innerHTML=`<video src="${e.v}" controls playsinline></video>`;box.classList.add('show');return;}
  const id=ytId(e.v);
  if(!id || location.protocol==='file:'){ if(e.v) window.open(e.v,'_blank'); return; }
  box.innerHTML=`<iframe src="https://www.youtube.com/embed/${id}?rel=0&playsinline=1" allow="encrypted-media; fullscreen; picture-in-picture" allowfullscreen referrerpolicy="origin"></iframe>`;
  box.classList.add('show');
  const fb=document.createElement('div');fb.className='vidfb';
  fb.innerHTML=`Se il player resta vuoto: <a href="${e.v}" target="_blank">apri su YouTube</a>`;
  box.after(fb); box._fb=fb;
}
// ---------- TIMER ----------
let T=null,left=0,total=0;
const bar=document.getElementById('bar'),tval=document.getElementById('tval'),
      tname=document.getElementById('tname'),fgc=document.querySelector('.fgc');
window.startTimer=function(sec,name){clearInterval(T);left=sec;total=sec;
  tname.textContent='Recupero: '+name;bar.classList.add('show');draw();
  T=setInterval(()=>{left--;draw();if(left<=0){clearInterval(T);beep();
    if(navigator.vibrate)navigator.vibrate([200,100,200]);tval.textContent='VIA!';}},1000);}
function draw(){const m=Math.floor(Math.max(left,0)/60),s=Math.max(left,0)%60;
  tval.textContent=m+':'+String(s).padStart(2,'0');
  fgc.style.strokeDashoffset=138.2*(1-Math.max(left,0)/total);}
document.getElementById('plus').onclick=()=>{left+=30;total=Math.max(total,left);draw();
  if(!T){T=setInterval(()=>{left--;draw();if(left<=0){clearInterval(T);T=null;beep();tval.textContent='VIA!';}},1000);}};
document.getElementById('stop').onclick=()=>{clearInterval(T);T=null;bar.classList.remove('show');};
function beep(){try{const ctx=new (window.AudioContext||window.webkitAudioContext)();
 [0,0.25,0.5].forEach(t=>{const o=ctx.createOscillator(),g=ctx.createGain();
  o.connect(g);g.connect(ctx.destination);o.frequency.value=880;
  g.gain.setValueAtTime(.4,ctx.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+t+.2);
  o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+.2);});}catch(e){}}
if('serviceWorker' in navigator && location.protocol!=='file:'){navigator.serviceWorker.register('sw.js');}
</script></body></html>
