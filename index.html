:root{--ink:#24272b;--bg:#e9eae6;--red:#a32a2a;--line:#d4d5d0}

body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,'Segoe UI',Roboto,sans-serif;padding-bottom:90px}
header{background:var(--ink);color:#fff;padding:14px 16px}

.topnav{display:flex;gap:8px;margin-top:10px}
.tn{flex:1;text-align:center;border:2px solid #4a4d52;color:#c8cacd;border-radius:999px;padding:8px 0;font-weight:800;font-size:13px;cursor:pointer}
.tn.on{background:var(--red);border-color:var(--red);color:#fff}
.wrap{max-width:760px;margin:0 auto;padding:12px}
.day{background:#fff;border:1px solid var(--line);border-radius:14px;margin:12px 0;padding:12px 14px}
.dayhead{display:flex;gap:8px;align-items:center}
.dayhead input{flex:1}
.ex{border:1px solid var(--line);border-radius:10px;background:#fafaf6;padding:10px 12px;margin:10px 0}
label{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:#6a6d70;margin:8px 0 2px}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;font-family:inherit;background:#fff}
textarea{min-height:64px;line-height:1.4}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
button{border:0;border-radius:9px;padding:9px 13px;font-weight:800;font-size:13.5px;cursor:pointer}
.add{background:#f0efe9;border:1px dashed #b9bab4;color:var(--ink);width:100%;margin-top:8px}
.del{background:#fdeaea;color:var(--red);float:right;padding:5px 10px;font-size:12px}
.updown{background:#f0efe9;color:var(--ink);padding:5px 10px;font-size:12px;margin-right:4px}
#save{position:fixed;left:0;right:0;bottom:0;background:var(--ink);padding:12px 16px;display:flex;gap:10px;z-index:10}
#save button{flex:1;padding:13px 0;font-size:15px;background:var(--red);color:#fff}
h3{margin:0}
.overlay{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.login{width:100%;max-width:340px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px}
.login h2{margin:0 0 14px;font-size:18px}
.login button{width:100%;margin-top:16px;padding:13px 0;font-size:15px;background:var(--red);color:#fff}
.err2{color:var(--red);font-size:13px;margin-top:10px;font-weight:700}
.okmsg{position:fixed;bottom:74px;left:16px;right:16px;background:#e4f3e8;border-left:3px solid #1f7a3d;padding:10px 12px;font-size:13.5px;border-radius:0 8px 8px 0;z-index:11}
/* storico */
.sess{background:#fff;border:1px solid var(--line);border-radius:12px;margin:10px 0;padding:12px 14px}
.sess .h{display:flex;justify-content:space-between;font-weight:800}
.sess .sub{font-size:12.5px;color:#6a6d70;margin:2px 0 8px}
.sess table{width:100%;border-collapse:collapse;font-size:13.5px}
.sess td{padding:4px 6px;border-top:1px solid #eee}
.sess td:nth-child(2),.sess td:nth-child(3){text-align:right;white-space:nowrap}
.badge{font-size:11px;font-weight:900;border-radius:6px;padding:2px 7px}
.badge.ok{background:#e4f3e8;color:#1f7a3d}
.badge.mid{background:#fff7e0;color:#9c7400}

.mistab{width:100%;border-collapse:collapse;margin:10px 0;font-size:13.5px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mistab th,.mistab td{border-bottom:1px solid #eee;padding:9px 10px;text-align:right}
.mistab th{background:#f0ece4;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.mistab td:first-child,.mistab th:first-child{text-align:left}
.dn{color:#1f7a3d;font-weight:800}.up{color:#a35a2a;font-weight:800}

document.getElementById('lbtn').onclick=async()=>{

onAuthStateChanged(auth,async u=>{
  if(!u){document.getElementById('loginov').style.display='flex';return;}
  document.getElementById('loginov').style.display='none';
  // elenco persone (registrate dalle app al primo accesso)
  try{
    const us=await getDocs(collection(db,'utenti'));
    UTENTI=[]; us.forEach(d=>{const v=d.data(); UTENTI.push({uid:d.id, nome:v.nome||v.email||d.id});});
  }catch(e){ UTENTI=[]; }
  const sel=document.getElementById('whoSel'); sel.innerHTML='';
  if(!UTENTI.length){ sel.innerHTML='<option>Nessun utente ha ancora aperto l\'app</option>'; }
  UTENTI.forEach(x=>{const o=document.createElement('option');o.value=x.uid;o.textContent=x.nome;sel.appendChild(o);});
  TARGET = UTENTI.length?UTENTI[0].uid:null;
  await caricaPersona();
});
window.cambiaPersona=async()=>{ TARGET=document.getElementById('whoSel').value; await caricaPersona(); };
async function caricaPersona(){
  if(!TARGET){S=JSON.parse(JSON.stringify(DEFAULT_SCHEDA));document.getElementById('titolo').value=S.titolo||'';render();return;}
  const snap=await getDoc(doc(db,'utenti',TARGET,'dati','scheda'));
  S=snap.exists()?snap.data():JSON.parse(JSON.stringify(DEFAULT_SCHEDA));
  document.getElementById('titolo').value=S.titolo||'';
  try{const ns=await getDoc(doc(db,'utenti',TARGET,'dati','nota'));
      document.getElementById('nota').value=ns.exists()?(ns.data().testo||''):'';}catch(e){}
  render(); loadLog(); if(document.getElementById('pgMis').style.display!=='none')loadMis();
}

}

// ---- storico allenamenti ----
function svgChart(pts,color,unit){
  if(pts.length<2) return '<p style="color:#888;font-size:13px">Servono almeno 2 misurazioni per il grafico.</p>';
  const W=680,H=170,P=34;
  const xs=pts.map((_,i)=>P+i*(W-2*P)/(pts.length-1));
  const vals=pts.map(p=>p.v);
  const mn=Math.min(...vals),mx=Math.max(...vals),rg=(mx-mn)||1;
  const ys=vals.map(v=>H-P-(v-mn)/rg*(H-2*P));
  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;background:#fff;border:1px solid #d4d5d0;border-radius:12px">`;
  s+=`<polyline fill="none" stroke="${color}" stroke-width="3" stroke-linejoin="round" points="${xs.map((x,i)=>x+','+ys[i]).join(' ')}"/>`;
  pts.forEach((p,i)=>{s+=`<circle cx="${xs[i]}" cy="${ys[i]}" r="4" fill="${color}"/>`;
    s+=`<text x="${xs[i]}" y="${ys[i]-9}" font-size="11" text-anchor="middle" fill="#444" font-weight="700">${p.v}${unit}</text>`;
    s+=`<text x="${xs[i]}" y="${H-10}" font-size="9.5" text-anchor="middle" fill="#888">${p.d.slice(5)}</text>`;});
  return s+'</svg>';
}
async function loadMis(){
  const box=document.getElementById('mislist');
  if(!TARGET){box.innerHTML='<p>Nessun utente.</p>';return;}
  try{
    const q=query(collection(db,'utenti',TARGET,'misure'),orderBy('creato','desc'),limit(60));
    const snap=await getDocs(q);
    if(snap.empty){box.innerHTML='<p>Nessuna misura registrata da tuo nipote.</p>';return;}
    const rows=[]; snap.forEach(d=>rows.push(d.data()));
    const asc=[...rows].reverse();
    const pesoPts=asc.filter(r=>r.peso).map(r=>({d:r.data,v:r.peso}));
    const vitaPts=asc.filter(r=>r.vita).map(r=>({d:r.data,v:r.vita}));
    let h='<h3 style="margin:6px 0">Peso (kg)</h3>'+svgChart(pesoPts,'#a32a2a',' ');
    h+='<h3 style="margin:14px 0 6px">Vita (cm)</h3>'+svgChart(vitaPts,'#9c7400',' ');
    h+='<table class="mistab"><tr><th>Data</th><th>Peso</th><th>Vita</th><th>Altezza</th><th>Var. peso</th></tr>';
    rows.forEach((r,i)=>{
      const prev=rows[i+1]; let tr='—';
      if(prev&&r.peso&&prev.peso){const d=r.peso-prev.peso;tr=`<span class="${d<0?'dn':(d>0?'up':'')}">${d>0?'+':''}${d.toFixed(1)}</span>`;}
      h+=`<tr><td>${r.data}${r.note?'<br><small style="color:#888">'+r.note+'</small>':''}</td>
        <td>${r.peso?r.peso+' kg':'—'}</td><td>${r.vita?r.vita+' cm':'—'}</td>
        <td>${r.altezza?r.altezza+' cm':'—'}</td><td>${tr}</td></tr>`;
    });
    box.innerHTML=h+'</table>';
  }catch(e){box.innerHTML='<p>Errore: '+e.message+'</p>';}
}
async function loadLog(){
  const box=document.getElementById('loglist');
  try{
    const q=query(collection(db,'utenti',TARGET,'allenamenti'),orderBy('creato','desc'),limit(60));
    const snap=await getDocs(q);
    if(snap.empty){box.innerHTML='<p>Nessun allenamento salvato finora.</p>';return;}
    // grafico carichi per esercizio
    window._sessions=[]; snap.forEach(dc=>window._sessions.push(dc.data()));
    const nomi=[...new Set(window._sessions.flatMap(s=>(s.esercizi||[]).filter(e=>e.kg).map(e=>e.n)))];
    let h='';
    if(nomi.length){
      h+='<label style="display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:#6a6d70;margin:4px 0 3px">Andamento carico</label>';
      h+='<select id="exsel" onchange="chartEx()" style="margin-bottom:8px">'+nomi.map(n=>`<option>${n}</option>`).join('')+'</select>';
      h+='<div id="exchart"></div>';
    }
    window._sessions.forEach(s=>{
      const pct=s.tot?Math.round(100*s.fatte/s.tot):0;
      const badge=pct>=90?'ok':'mid';
      h+=`<div class="sess"><div class="h"><span>${s.data} — ${s.giorno}${s.gruppo?(' · '+s.gruppo):''}</span>
        <span class="badge ${badge}">${s.fatte}/${s.tot} serie</span></div>
        <div class="sub">${s.utente||''}</div>
        <table>${(s.esercizi||[]).map(e=>`<tr><td>${e.n}</td><td>${e.fatte}/${e.tot}</td><td>${e.kg?e.kg+' kg':'—'}</td></tr>`).join('')}</table>
      </div>`;
    });
    box.innerHTML=h;
    if(document.getElementById('exsel')) chartEx();
  }catch(e){box.innerHTML='<p>Errore nel caricamento: '+e.message+'</p>';}
}
window.chartEx=function(){
  const n=document.getElementById('exsel').value;
  const pts=[...window._sessions].reverse()
    .map(s=>{const e=(s.esercizi||[]).find(x=>x.n===n&&x.kg);return e?{d:s.data,v:parseFloat(e.kg)}:null;})
    .filter(Boolean);
  document.getElementById('exchart').innerHTML=svgChart(pts,'#a32a2a',' kg');
}
